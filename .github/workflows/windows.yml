name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test battery readers and tray styles
        shell: powershell
        run: .\src\build.ps1 -Test
      - name: Build portable package
        shell: powershell
        run: .\scripts\package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: release
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = (Get-ChildItem -Path release -File).FullName
          gh release create "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "$env:GITHUB_REF_NAME" --generate-notes
